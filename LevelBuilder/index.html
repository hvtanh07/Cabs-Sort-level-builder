<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap Sort Level Builder</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><b>Cap Sort</b> Level Builder</div>
  <div class="seg" id="modeSeg" role="tablist">
    <button data-mode="edit" class="on" title="Edit the level (Esc)">✎ Edit</button>
    <button data-mode="play" title="Play test the level (F5 / Ctrl+Enter)">▶ Play test</button>
  </div>
  <div class="top-actions">
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="btnImport" title="Import level JSON files">Import</button>
    <button id="btnExport" title="Download this level as JSON (Ctrl+S saves to the linked folder when one is open)">Export</button>
    <button id="btnCopy" title="Copy this level's JSON to the clipboard">Copy JSON</button>
    <button id="btnConveyors" title="Manage and import conveyor configs">Conveyors</button>
    <button id="btnReset" title="Throw away the edits kept in this browser and load the levels again from the level files">Reset levels</button>
    <button id="btnHelp" title="Shortcuts and file formats">?</button>
  </div>
</header>

<div class="app">
  <aside class="left">
    <div class="lp-head">
      <h2>Levels <span id="levelCount"></span></h2>
      <button id="btnNew" class="primary" title="New level">+ New</button>
    </div>
    <input id="levelSearch" class="search" type="search" placeholder="Search levels">
    <ol id="levelList" class="level-list"></ol>
    <div class="lp-foot">
      <button id="btnDup" title="Duplicate the selected level">Duplicate</button>
      <button id="btnDel" title="Delete the selected level">Delete</button>
      <button id="btnExportAll" title="Download every level (zip, or one bundle JSON if offline)">Export all</button>
      <button id="btnFolder" title="Open a folder of level JSON files (Chrome / Edge) to load and save directly">Open folder</button>
      <div id="folderInfo" class="folder-info"></div>
    </div>
  </aside>

  <main class="center">
    <div class="toolbar" id="editBar">
      <div class="seg small" id="toolSeg">
        <button data-tool="select" class="on" title="Select (V)">⬚ Select</button>
        <button data-tool="paint" title="Paint colour on items and boxes (B)">🖌 Paint</button>
        <button data-tool="link" title="Link two boxes in neighbouring queues (L)">⛓ Link</button>
      </div>
      <div class="palette" id="palette"></div>
      <span class="grow"></span>
      <button id="btnBalance" title="Rebuild Enter Path items so every colour matches the box capacity">Fill items from boxes</button>
      <button id="btnRandom" title="Generate a random level">Random…</button>
    </div>
    <div class="balance-bar" id="balanceBar"></div>
    <div class="toolbar hidden" id="playBar">
      <button id="pPause" class="primary">❚❚ Pause</button>
      <button id="pRestart" title="Restart (R)">↺ Restart</button>
      <div class="seg small" id="speedSeg">
        <button data-speed="0.5">½×</button><button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
      </div>
      <button id="pStep" title="Advance the conveyor by one row (.)">Step</button>
      <label class="chk"><input type="checkbox" id="pAuto"> Auto play</label>
      <label class="chk" title="Where boxes in the slots pull items from the conveyor">Pickup
        <select id="pPick">
          <option value="fly">Fly to any matching box</option>
          <option value="low">Lowest point (old)</option>
          <option value="zone">Pickup zone (pickRows, old)</option>
          <option value="any">Anywhere, 1 per step (old)</option>
        </select></label>
      <span class="grow"></span>
      <button id="pExit">Back to edit</button>
    </div>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <div class="feeders" id="feeders"></div>
        <div class="conv"><canvas id="convCanvas"></canvas></div>
        <div class="slots" id="slots"></div>
        <div class="queues" id="queues"></div>
        <canvas id="fx"></canvas>
        <div class="banner hidden" id="banner"></div>
      </div>
    </div>
    <div class="statusbar" id="statusBar"></div>
  </main>

  <aside class="right" id="inspector"></aside>
</div>

<div class="toast" id="toast"></div>
<div class="pop hidden" id="pop"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<input type="file" id="fileLevels" accept=".json,application/json" multiple hidden>
<input type="file" id="fileConv" accept=".json,application/json" multiple hidden>

<script src="js/conveyors.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/editor.js"></script>
<script src="js/play.js"></script>
<script src="js/ux.js"></script>
<script src="js/sample.js"></script>
<script src="js/levels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
